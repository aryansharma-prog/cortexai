<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cortex_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="cortex_saffron" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#cortex_bg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Saffron Neural Core / Cortex Nodes & Connections -->
  <g filter="url(#glow)">
    <!-- Interconnecting neural synapses -->
    <path d="M 22 20 L 42 20 L 48 32 L 32 46 L 16 32 Z" fill="none" stroke="url(#cortex_saffron)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.7" />
    <path d="M 22 20 L 32 32 L 42 20" fill="none" stroke="url(#cortex_saffron)" stroke-width="2" stroke-linecap="round" />
    <path d="M 16 32 L 32 32 L 48 32" fill="none" stroke="url(#cortex_saffron)" stroke-width="2" stroke-linecap="round" />
    <path d="M 32 32 L 32 46" fill="none" stroke="url(#cortex_saffron)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Outer Cortex Nodes -->
    <circle cx="22" cy="20" r="3.5" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <circle cx="42" cy="20" r="3.5" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <circle cx="48" cy="32" r="3.5" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <circle cx="32" cy="46" r="3.5" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <circle cx="16" cy="32" r="3.5" fill="#ffffff" stroke="#ea580c" stroke-width="2" />

    <!-- Central Radiant Core Node -->
    <circle cx="32" cy="32" r="5" fill="url(#cortex_saffron)" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>